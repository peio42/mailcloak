name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure workflow runs from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow must be run from main (got ${GITHUB_REF})"
            exit 1
          fi
      - name: Validate version
        run: |
          echo "${{ github.event.inputs.version }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'

  e2e:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [keycloak, authentik]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test (e2e)
        env:
          E2E_PROVIDER: ${{ matrix.provider }}
        run: go test -tags=e2e ./tests/e2e -v

  build:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build arch-specific tarball
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eux
          mkdir -p dist
          BIN="mailcloak-${GOOS}-${GOARCH}"

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${BIN}" ./cmd/mailcloak

          tar -C dist -czf "dist/${BIN}.tar.gz" "${BIN}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [e2e, build]

    steps:
      - name: Checkout (for mailcloakctl)
        uses: actions/checkout@v4

      - name: Download all tarball artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Gather assets
        run: |
          set -eux
          mkdir -p dist

          find dist-all -type f -name "*.tar.gz" -exec cp -v {} dist/ \;
          cp -v mailcloakctl dist/

          ls -lah dist

      - name: Generate checksums.txt (sha256)
        run: |
          set -eux
          cd dist

          LC_ALL=C sha256sum $(ls -1 | sort) > checksums.txt

          echo "Generated checksums.txt:"
          cat checksums.txt

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ github.event.inputs.version }}" -m "mailcloak ${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/mailcloakctl
            dist/checksums.txt
          overwrite_files: true
